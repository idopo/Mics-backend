[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mics"
version = "0.1.0"
description = "MICS offline analysis toolkit — unify Elasticsearch events, Open Ephys signals, and sorted spikes per session"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "elasticsearch>=8.10,<9",  # server is ES 8.10.2; 9.x client sends incompatible compatible-with=9 headers
    "matplotlib",
]

[project.optional-dependencies]
# Kept out of base so events-only runs need no ephys reader installed.
ephys = ["open-ephys-python-tools"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
